name: Update VPN subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'

permissions:
  contents: read

concurrency:
  group: vpn-aggregator-update
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  update:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      E2E_VERIFY: '1'
      E2E_CONCURRENCY: '6'
      E2E_TIMEOUT: '7'
      XRAY_BIN: ${{ github.workspace }}/bin/xray
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install e2e client
        run: |
          mkdir -p bin
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 755 /tmp/xray/xray bin/xray
          bin/xray version

      - name: Run collector
        run: python collector.py

      - name: Validate generated subscriptions
        run: pytest tests/test_outputs.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/generated
          cp vless_universal.txt hysteria2.txt all_universal.txt stats.json source_health.json /tmp/generated/

          push_generated() {
            git fetch -q origin main
            git reset --hard -q FETCH_HEAD
            cp /tmp/generated/* .
            git add vless_universal.txt hysteria2.txt all_universal.txt
            if git diff --staged --quiet; then
              if ! git diff --quiet -- source_health.json; then
                git add source_health.json
                git commit -m "Update source health [skip ci]"
                git push
              else
                echo "No changes to commit"
              fi
            else
              git add stats.json source_health.json
              git commit -m "Auto-update VPN nodes (VLESS, Hy2, Trojan) [skip ci]"
              git push
            fi
          }

          if ! push_generated; then
            echo "Push race detected, retrying with a fresh base..."
            push_generated
          fi

  alert:
    needs: [test, update]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="VPN aggregator quality alert"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          body="Workflow failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
